name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep macOS validation on the same pinned image as release packaging.
        os: [ubuntu-latest, windows-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux tray and media dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev ffmpeg

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Test web UI
        run: npm test --prefix web

      - name: go vet
        run: go vet ./...

      - name: Build binaries
        run: go build ./...

      # Runs on every OS so platform-specific paths (notably the Windows
      # credstore machine-seed) are actually exercised, not just cross-compiled.
      - name: Test
        run: go test ./... -count=1

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build
      - name: Web coverage
        run: npm run coverage --prefix web
      - name: Install Linux tray and media dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev ffmpeg
      - name: Test (race)
        run: go test -race ./... -count=1
      - name: Audit frontend dependencies
        run: npm audit --prefix web --audit-level=high
      - name: Audit reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
