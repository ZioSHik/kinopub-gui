name: Release

on:
  push:
    tags:
      - "v*"

  # Exercise the same packaging steps on build-configuration PRs without publishing.
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.node-version'
      - 'Makefile'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'web/package*.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A valid numeric version keeps macOS Info.plist valid in validation builds.
  VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-test-{0}', github.run_number) }}

jobs:
  # macOS GUI is built on a real Mac so CGO is on and the menu-bar (systray)
  # shell is compiled in. Produces the .dmg installers and the bare darwin GUI
  # binaries the in-app updater downloads (extracted from the bundles so the
  # updated binary keeps the menu-bar shell).
  macos:
    name: macOS (.dmg + updater binaries)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version

      - name: Build web UI
        run: cd web && npm ci && npm run build

      - name: Build .app, .dmg and updater binaries (arm64 + amd64)
        run: |
          set -euo pipefail
          mkdir -p out
          ARCH=arm64  ./scripts/package-macos.sh
          cp dist-app/KinoPub.app/Contents/MacOS/kinopub-gui out/kinopub-gui-darwin-arm64
          ARCH=x86_64 ./scripts/package-macos.sh
          cp dist-app/KinoPub.app/Contents/MacOS/kinopub-gui out/kinopub-gui-darwin-amd64
          cp dist-app/*.dmg out/
          ls -la out

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  # Everything cross-compilable on Linux: the GUI for Windows (no-console + icon +
  # tray; systray is pure-Go on Windows), Linux and Android. The Linux amd64 GUI
  # links GTK/appindicator for its tray (CGO on).
  linux-windows:
    name: Linux, Windows & Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version

      - name: Install Linux tray build deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build web UI
        run: cd web && npm ci && npm run build

      - name: Build GUI binaries
        run: |
          set -euo pipefail
          mkdir -p out
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # ---- GUI: Windows (no console + embedded icon; systray is pure-Go here) ----
          make winsyso
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags="$LDFLAGS -H windowsgui" -trimpath -o out/kinopub-gui-windows-amd64.exe ./cmd/kinopub-gui
          rm -f cmd/kinopub-gui/resource_windows_amd64.syso

          # ---- GUI: Linux arm64 + Android (headless, static — no tray) ----
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -trimpath -o out/kinopub-gui-linux-arm64   ./cmd/kinopub-gui
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="$LDFLAGS" -trimpath -o out/kinopub-gui-android-arm64 ./cmd/kinopub-gui

          # ---- GUI: Linux amd64 (tray via GTK/appindicator — needs CGO) ----
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -trimpath -o out/kinopub-gui-linux-amd64 ./cmd/kinopub-gui

          ls -la out

      - name: Build Linux AppImage (amd64, tray)
        run: |
          set -euxo pipefail
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp out/kinopub-gui-linux-amd64 "$APPDIR/usr/bin/kinopub-gui"
          chmod +x "$APPDIR/usr/bin/kinopub-gui"
          cp build/icons/icon-256.png "$APPDIR/kinopub-gui.png"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=KinoPub Downloader' \
            'Exec=kinopub-gui' 'Icon=kinopub-gui' 'Categories=AudioVideo;Network;' 'Terminal=false' \
            > "$APPDIR/kinopub-gui.desktop"
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/kinopub-gui" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          # Pin both the tool and its embedded runtime; otherwise appimagetool
          # downloads the latest runtime even when the tool version is fixed.
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o appimagetool
          curl --fail --location --retry 3 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 -o appimage-runtime
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool' | sha256sum --check --strict
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  appimage-runtime' | sha256sum --check --strict
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --runtime-file appimage-runtime "$APPDIR" "out/KinoPub-${VERSION}-x86_64.AppImage"
          # Smoke-test the generated runtime without requiring FUSE or a display.
          chmod +x "out/KinoPub-${VERSION}-x86_64.AppImage"
          "out/KinoPub-${VERSION}-x86_64.AppImage" --appimage-extract-and-run -version

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: linux-windows
          path: out/*
          if-no-files-found: error

  # Validate the exact bundle that will be published, including updater checksums.
  release:
    name: Verify release bundle
    runs-on: ubuntu-latest
    needs: [macos, linux-windows]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Verify files and generate updater checksums
        run: ./scripts/verify-release.sh dist

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-bundle
          path: dist

      - name: Check downloaded bundle
        working-directory: dist
        run: sha256sum --check --strict checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
